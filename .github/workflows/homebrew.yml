name: publish homebrew formula

on:
    workflow_call:
        inputs:
            tag:
                required: true
                type: string
        secrets:
            GH_PAT:
                required: true
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to publish
                required: true
                type: string

permissions:
    contents: read

concurrency:
    group: homebrew
    cancel-in-progress: false

jobs:
    publish:
        name: homebrew
        runs-on: ubuntu-slim
        env:
            GH_TOKEN: ${{ github.token }}
            RELEASE_TAG: ${{ inputs.tag }}
        steps:
            - uses: actions/checkout@v7
              with:
                  ref: ${{ inputs.tag }}
            - name: generate formula
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" \
                      --jq '.assets[] | "\(.name)\t\(.digest)"' > "$RUNNER_TEMP/assets.tsv"
                  asset() {
                      awk -F'\t' -v name="$1" '$1 == name { sub(/^sha256:/, "", $2); print $2 }' "$RUNNER_TEMP/assets.tsv"
                  }
                  darwin_x64=$(asset pi-ui-darwin-x64.zip)
                  darwin_arm64=$(asset pi-ui-darwin-arm64.zip)
                  if [[ -z $darwin_x64 || -z $darwin_arm64 ]]; then
                      echo "missing release asset digests" >&2
                      exit 1
                  fi
                  V="${RELEASE_TAG#v}"
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_DARWIN_X64}}/$darwin_x64/g" \
                      -e "s/{{SHA_DARWIN_ARM64}}/$darwin_arm64/g" \
                      packaging/homebrew/pi-ui.rb.in > "$RUNNER_TEMP/pi-ui.rb"
            - name: publish formula
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
              run: |
                  test -n "$GH_TOKEN"
                  gh auth setup-git --hostname github.com
                  directory="$RUNNER_TEMP/homebrew-tap"
                  git clone --depth=1 --single-branch --no-tags https://github.com/hyperpuncher/homebrew-tap.git "$directory"
                  mkdir -p "$directory/Formula"
                  cp "$RUNNER_TEMP/pi-ui.rb" "$directory/Formula/pi-ui.rb"
                  rm -f "$directory/Formula/pi-ui-server.rb" "$directory/Casks/pi-ui.rb"
                  test -f "$directory/formula_renames.json" || echo '{}' > "$directory/formula_renames.json"
                  jq '. + {"pi-ui-server": "pi-ui"}' "$directory/formula_renames.json" > "$RUNNER_TEMP/formula_renames.json"
                  mv "$RUNNER_TEMP/formula_renames.json" "$directory/formula_renames.json"
                  git -C "$directory" config user.name github-actions
                  git -C "$directory" config user.email github-actions@github.com
                  git -C "$directory" add -A Formula Casks formula_renames.json
                  if ! git -C "$directory" diff --cached --quiet; then
                    git -C "$directory" commit -m "chore: update pi-ui for $RELEASE_TAG"
                    git -C "$directory" push
                  fi
