name: Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    build:
        name: Build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      os: ubuntu-26.04
                    - name: linux-arm64
                      os: ubuntu-26.04-arm
                    - name: darwin-x64
                      os: macos-26-intel
                    - name: darwin-arm64
                      os: macos-26
                    - name: windows-x64
                      os: windows-latest

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - name: Install dependencies
              run: bun ci
            - name: Build executable
              run: bun run build
            - name: Package artifact
              shell: bash
              run: |
                  case "${{ matrix.name }}" in
                    linux-*)
                      ZSTD_CLEVEL=19 tar --zstd -cf "dist/pi-ui-${{ matrix.name }}.tar.zst" -C dist pi-ui
                      ;;
                    darwin-*)
                      (cd dist && ditto -c -k --keepParent pi-ui "pi-ui-${{ matrix.name }}.zip")
                      ;;
                    windows-*)
                      (cd dist && 7z a "pi-ui-${{ matrix.name }}.zip" pi-ui.exe)
                      ;;
                  esac
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.name }}
                  path: dist/pi-ui-${{ matrix.name }}.*

    publish:
        name: Publish GitHub release
        if: github.event_name == 'push'
        needs: [build]
        runs-on: ubuntu-26.04
        permissions:
            contents: write
        outputs:
            linux-x64: ${{ steps.sha.outputs.linux-x64 }}
            linux-arm64: ${{ steps.sha.outputs.linux-arm64 }}
            darwin-x64: ${{ steps.sha.outputs.darwin-x64 }}
            darwin-arm64: ${{ steps.sha.outputs.darwin-arm64 }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8
              with:
                  path: dist
            - name: Flatten artifacts
              run: |
                  find dist -mindepth 2 -type f -exec mv {} dist/ \;
                  find dist -mindepth 1 -type d -empty -delete
                  ls -lh dist
            - name: Generate release notes
              run: bash scripts/release-notes.sh > /tmp/release-notes.md
            - name: GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*
                  body_path: /tmp/release-notes.md
            - name: Compute checksums
              id: sha
              run: |
                  {
                    echo "linux-x64=$(sha256sum dist/pi-ui-linux-x64.tar.zst | cut -d' ' -f1)"
                    echo "linux-arm64=$(sha256sum dist/pi-ui-linux-arm64.tar.zst | cut -d' ' -f1)"
                    echo "darwin-x64=$(sha256sum dist/pi-ui-darwin-x64.zip | cut -d' ' -f1)"
                    echo "darwin-arm64=$(sha256sum dist/pi-ui-darwin-arm64.zip | cut -d' ' -f1)"
                  } >> "$GITHUB_OUTPUT"

    npm:
        name: Publish npm package
        needs: [publish]
        runs-on: ubuntu-26.04
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - name: Install npm package dependencies
              run: bun ci
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
            - name: Publish npm package
              run: npm publish

    homebrew:
        name: Publish Homebrew formula
        needs: [publish]
        runs-on: ubuntu-26.04
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7
            - name: Generate Homebrew formula
              run: |
                  V="${GITHUB_REF_NAME#v}"
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_DARWIN_X64}}/${{ needs.publish.outputs.darwin-x64 }}/g" \
                      -e "s/{{SHA_DARWIN_ARM64}}/${{ needs.publish.outputs.darwin-arm64 }}/g" \
                      packaging/homebrew/pi-ui.rb.in > /tmp/pi-ui.rb
            - name: Push Homebrew formula
              env:
                  GH_PAT: ${{ secrets.GH_PAT }}
              run: |
                  git clone "https://x-access-token:${GH_PAT}@github.com/hyperpuncher/homebrew-tap.git" /tmp/homebrew-tap
                  mkdir -p /tmp/homebrew-tap/Formula
                  cp /tmp/pi-ui.rb /tmp/homebrew-tap/Formula/pi-ui.rb
                  rm -f /tmp/homebrew-tap/Formula/pi-ui-server.rb /tmp/homebrew-tap/Casks/pi-ui.rb
                  test -f /tmp/homebrew-tap/formula_renames.json || echo '{}' > /tmp/homebrew-tap/formula_renames.json
                  jq '. + {"pi-ui-server": "pi-ui"}' /tmp/homebrew-tap/formula_renames.json > /tmp/formula_renames.json
                  mv /tmp/formula_renames.json /tmp/homebrew-tap/formula_renames.json
                  cd /tmp/homebrew-tap
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git add -A Formula Casks formula_renames.json
                  git diff --staged --quiet || git commit -m "pi-ui: renamed from pi-ui-server"
                  git push

    aur:
        name: Publish AUR package
        needs: [publish]
        runs-on: ubuntu-26.04
        container: archlinux:base-devel
        permissions:
            contents: read

        steps:
            - name: Install publishing tools
              run: pacman -Syu --noconfirm --needed git openssh
            - uses: actions/checkout@v7
            - name: Generate AUR package
              run: |
                  V="${GITHUB_REF_NAME#v}"
                  LICENSE_SHA=$(sha256sum LICENSE | cut -d' ' -f1)
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_LICENSE}}/$LICENSE_SHA/g" \
                      -e "s/{{SHA_LINUX_X64}}/${{ needs.publish.outputs.linux-x64 }}/g" \
                      -e "s/{{SHA_LINUX_ARM64}}/${{ needs.publish.outputs.linux-arm64 }}/g" \
                      packaging/aur/PKGBUILD.in > /tmp/PKGBUILD
                  useradd --create-home builder
                  install -o builder -g builder -m 644 /tmp/PKGBUILD /home/builder/PKGBUILD
                  runuser --user builder -- bash -c 'cd /home/builder && makepkg --printsrcinfo' > /tmp/.SRCINFO
            - name: Push AUR package
              env:
                  AUR_KEY: ${{ secrets.AUR_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$AUR_KEY" > ~/.ssh/aur_key
                  chmod 600 ~/.ssh/aur_key
                  ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
                  export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts"
                  git clone ssh://aur@aur.archlinux.org/pi-ui-bin.git /tmp/aur-repo
                  cp /tmp/PKGBUILD /tmp/aur-repo/PKGBUILD
                  cp /tmp/.SRCINFO /tmp/aur-repo/.SRCINFO
                  cp LICENSE /tmp/aur-repo/LICENSE
                  cd /tmp/aur-repo
                  git config user.name "hyperpuncher"
                  git config user.email "hyperpuncher@users.noreply.github.com"
                  git add PKGBUILD .SRCINFO LICENSE
                  git diff --staged --quiet || git commit -m "upgpkg: pi-ui-bin ${GITHUB_REF_NAME#v}"
                  git push
