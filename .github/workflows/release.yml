name: release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    build:
        name: build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      os: ubuntu-26.04
                    - name: linux-arm64
                      os: ubuntu-26.04-arm
                    - name: darwin-x64
                      os: macos-26-intel
                    - name: darwin-arm64
                      os: macos-26
                    - name: windows-x64
                      os: windows-latest

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - name: install dependencies
              run: bun ci
            - name: build executable
              run: bun run build
            - name: package artifact
              shell: bash
              env:
                  NAME: ${{ matrix.name }}
              run: |
                  case "$NAME" in
                    linux-*)
                      tar -I 'zstd -10 -T0' -cf "dist/pi-ui-$NAME.tar.zst" -C dist pi-ui
                      ;;
                    darwin-*)
                      (cd dist && ditto -c -k --keepParent pi-ui "pi-ui-$NAME.zip")
                      ;;
                    windows-*)
                      (cd dist && 7z a "pi-ui-$NAME.zip" pi-ui.exe)
                      ;;
                  esac
            - uses: actions/upload-artifact@v7
              with:
                  path: dist/pi-ui-${{ matrix.name }}.*
                  archive: false

    release:
        name: release
        if: github.event_name == 'push'
        needs: [build]
        runs-on: ubuntu-slim
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true
                  skip-decompress: true
            - uses: hyperpuncher/release-notes@v1
              id: notes
            - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.path }}"

    npm:
        name: npm
        needs: [release]
        runs-on: ubuntu-slim
        permissions:
            contents: read
            id-token: write

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - name: install dependencies
              run: bun ci
            - uses: actions/setup-node@v7
              with:
                  node-version: 26
            - name: publish package
              run: npm publish

    homebrew:
        name: homebrew
        needs: [release]
        runs-on: ubuntu-slim
        permissions:
            contents: read
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@v7
            - name: generate formula
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                      --jq '.assets[] | "\(.name)\t\(.digest)"' > "$RUNNER_TEMP/assets.tsv"
                  asset() {
                      awk -F'\t' -v name="$1" '$1 == name { sub(/^sha256:/, "", $2); print $2 }' "$RUNNER_TEMP/assets.tsv"
                  }
                  darwin_x64=$(asset pi-ui-darwin-x64.zip)
                  darwin_arm64=$(asset pi-ui-darwin-arm64.zip)
                  if [[ -z $darwin_x64 || -z $darwin_arm64 ]]; then
                      echo "missing release asset digests" >&2
                      exit 1
                  fi
                  V="${GITHUB_REF_NAME#v}"
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_DARWIN_X64}}/$darwin_x64/g" \
                      -e "s/{{SHA_DARWIN_ARM64}}/$darwin_arm64/g" \
                      packaging/homebrew/pi-ui.rb.in > "$RUNNER_TEMP/pi-ui.rb"
            - name: publish formula
              env:
                  GH_TOKEN: ${{ secrets.GH_PAT }}
              run: |
                  test -n "$GH_TOKEN"
                  gh auth setup-git --hostname github.com
                  directory="$RUNNER_TEMP/homebrew-tap"
                  git clone --depth=1 --single-branch --no-tags https://github.com/hyperpuncher/homebrew-tap.git "$directory"
                  mkdir -p "$directory/Formula"
                  cp "$RUNNER_TEMP/pi-ui.rb" "$directory/Formula/pi-ui.rb"
                  rm -f "$directory/Formula/pi-ui-server.rb" "$directory/Casks/pi-ui.rb"
                  test -f "$directory/formula_renames.json" || echo '{}' > "$directory/formula_renames.json"
                  jq '. + {"pi-ui-server": "pi-ui"}' "$directory/formula_renames.json" > "$RUNNER_TEMP/formula_renames.json"
                  mv "$RUNNER_TEMP/formula_renames.json" "$directory/formula_renames.json"
                  git -C "$directory" config user.name github-actions
                  git -C "$directory" config user.email github-actions@github.com
                  git -C "$directory" add -A Formula Casks formula_renames.json
                  if ! git -C "$directory" diff --cached --quiet; then
                    git -C "$directory" commit -m "chore: update pi-ui for $GITHUB_REF_NAME"
                    git -C "$directory" push
                  fi

    aur:
        name: aur
        needs: [release]
        runs-on: ubuntu-26.04
        container: archlinux:base-devel
        permissions:
            contents: read
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - name: install publishing tools
              run: pacman -Syu --noconfirm --needed git openssh github-cli
            - uses: actions/checkout@v7
            - name: generate recipe
              run: |
                  gh api "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
                      --jq '.assets[] | "\(.name)\t\(.digest)"' > "$RUNNER_TEMP/assets.tsv"
                  asset() {
                      awk -F'\t' -v name="$1" '$1 == name { sub(/^sha256:/, "", $2); print $2 }' "$RUNNER_TEMP/assets.tsv"
                  }
                  linux_x64=$(asset pi-ui-linux-x64.tar.zst)
                  linux_arm64=$(asset pi-ui-linux-arm64.tar.zst)
                  if [[ -z $linux_x64 || -z $linux_arm64 ]]; then
                      echo "missing release asset digests" >&2
                      exit 1
                  fi
                  V="${GITHUB_REF_NAME#v}"
                  LICENSE_SHA=$(sha256sum LICENSE | cut -d' ' -f1)
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_LICENSE}}/$LICENSE_SHA/g" \
                      -e "s/{{SHA_LINUX_X64}}/$linux_x64/g" \
                      -e "s/{{SHA_LINUX_ARM64}}/$linux_arm64/g" \
                      packaging/aur/PKGBUILD.in > "$RUNNER_TEMP/PKGBUILD"
                  useradd --create-home builder
                  install -o builder -g builder -m 644 "$RUNNER_TEMP/PKGBUILD" /home/builder/PKGBUILD
                  runuser --user builder -- bash -c 'cd /home/builder && makepkg --printsrcinfo' > "$RUNNER_TEMP/.SRCINFO"
            - name: publish package
              env:
                  AUR_KEY: ${{ secrets.AUR_KEY }}
              run: |
                  umask 077
                  test -n "$AUR_KEY"
                  printf '%s\n' "$AUR_KEY" > "$RUNNER_TEMP/aur_key"
                  trap 'shred -u "$RUNNER_TEMP/aur_key"' EXIT
                  export GIT_SSH_COMMAND="ssh -i $RUNNER_TEMP/aur_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/aur_known_hosts"
                  directory="$RUNNER_TEMP/aur-repo"
                  git -c init.defaultBranch=master clone --depth=1 --single-branch --no-tags ssh://aur@aur.archlinux.org/pi-ui-bin.git "$directory"
                  cp "$RUNNER_TEMP/PKGBUILD" "$RUNNER_TEMP/.SRCINFO" LICENSE "$directory/"
                  git -C "$directory" config user.name hyperpuncher
                  git -C "$directory" config user.email hyperpuncher@users.noreply.github.com
                  git -C "$directory" add PKGBUILD .SRCINFO LICENSE
                  if ! git -C "$directory" diff --cached --quiet; then
                    git -C "$directory" commit -m "upgpkg: pi-ui-bin ${GITHUB_REF_NAME#v}"
                    git -C "$directory" push origin HEAD:master
                  fi
