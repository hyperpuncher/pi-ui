name: Release

env:
    BUN_VERSION: 1.4.0

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    build:
        name: Build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      os: ubuntu-latest
                    - name: linux-arm64
                      os: ubuntu-24.04-arm
                    - name: darwin-x64
                      os: macos-26-intel
                    - name: darwin-arm64
                      os: macos-26
                    - name: windows-x64
                      os: windows-latest

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: ${{ env.BUN_VERSION }}
            - name: Install dependencies
              run: bun ci
            - name: Build executable
              run: bun run build
            - name: Package artifact
              shell: bash
              run: |
                  case "${{ matrix.name }}" in
                    linux-*)
                      ZSTD_CLEVEL=19 tar --zstd -cf "dist/pi-ui-server-${{ matrix.name }}.tar.zst" -C dist pi-ui-server
                      ;;
                    darwin-*)
                      (cd dist && ditto -c -k --keepParent pi-ui-server "pi-ui-server-${{ matrix.name }}.zip")
                      ;;
                    windows-*)
                      (cd dist && 7z a "pi-ui-server-${{ matrix.name }}.zip" pi-ui-server.exe)
                      ;;
                  esac
            - name: Upload artifact
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.name }}
                  path: dist/pi-ui-server-${{ matrix.name }}.*

    publish:
        name: Publish release and packages
        if: github.event_name == 'push'
        needs: [build]
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8
              with:
                  path: dist
            - name: Flatten artifacts
              run: |
                  find dist -mindepth 2 -type f -exec mv {} dist/ \;
                  find dist -mindepth 1 -type d -empty -delete
                  ls -lh dist
            - name: Generate release notes
              shell: bash
              run: |
                  previous_tag=$(git describe --tags --match "v[0-9]*" --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
                  repository_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"

                  {
                    echo "### What's Changed"
                    echo
                    if [[ -n "$previous_tag" ]]; then
                      git log --reverse --format="- %s [\`%h\`](${repository_url}/commit/%H)" "${previous_tag}..${GITHUB_REF_NAME}"
                      echo
                      echo "**Full Changelog:** [${previous_tag}...${GITHUB_REF_NAME}](${repository_url}/compare/${previous_tag}...${GITHUB_REF_NAME})"
                    else
                      git log --reverse --format="- %s [\`%h\`](${repository_url}/commit/%H)" "$GITHUB_REF_NAME"
                    fi
                  } > /tmp/release-notes.md
            - name: GitHub release
              uses: softprops/action-gh-release@v3
              with:
                  files: dist/*
                  body_path: /tmp/release-notes.md
            - name: Compute checksums
              id: sha
              run: |
                  {
                    echo "linux-x64=$(sha256sum dist/pi-ui-server-linux-x64.tar.zst | cut -d' ' -f1)"
                    echo "linux-arm64=$(sha256sum dist/pi-ui-server-linux-arm64.tar.zst | cut -d' ' -f1)"
                    echo "darwin-x64=$(sha256sum dist/pi-ui-server-darwin-x64.zip | cut -d' ' -f1)"
                    echo "darwin-arm64=$(sha256sum dist/pi-ui-server-darwin-arm64.zip | cut -d' ' -f1)"
                  } >> "$GITHUB_OUTPUT"
            - name: Generate Homebrew formula
              run: |
                  V="${GITHUB_REF_NAME#v}"
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_DARWIN_X64}}/${{ steps.sha.outputs.darwin-x64 }}/g" \
                      -e "s/{{SHA_DARWIN_ARM64}}/${{ steps.sha.outputs.darwin-arm64 }}/g" \
                      packaging/homebrew/pi-ui-server.rb.in > /tmp/pi-ui-server.rb
            - name: Push Homebrew formula
              env:
                  GH_PAT: ${{ secrets.GH_PAT }}
              run: |
                  git clone "https://x-access-token:${GH_PAT}@github.com/hyperpuncher/homebrew-tap.git" /tmp/homebrew-tap
                  mkdir -p /tmp/homebrew-tap/Formula
                  cp /tmp/pi-ui-server.rb /tmp/homebrew-tap/Formula/pi-ui-server.rb
                  cd /tmp/homebrew-tap
                  git config user.name "github-actions"
                  git config user.email "github-actions@github.com"
                  git add Formula/pi-ui-server.rb
                  git diff --staged --quiet || git commit -m "pi-ui ${GITHUB_REF_NAME}"
                  git push
            - name: Generate AUR package
              run: |
                  V="${GITHUB_REF_NAME#v}"
                  LICENSE_SHA=$(sha256sum LICENSE | cut -d' ' -f1)
                  sed -e "s/{{VERSION}}/$V/g" \
                      -e "s/{{SHA_LICENSE}}/$LICENSE_SHA/g" \
                      -e "s/{{SHA_LINUX_X64}}/${{ steps.sha.outputs.linux-x64 }}/g" \
                      -e "s/{{SHA_LINUX_ARM64}}/${{ steps.sha.outputs.linux-arm64 }}/g" \
                      packaging/aur/PKGBUILD.server.in > /tmp/PKGBUILD
                  docker run --rm --interactive archlinux:base-devel bash -c '
                    useradd --create-home builder
                    cat > /home/builder/PKGBUILD
                    chown builder:builder /home/builder/PKGBUILD
                    cd /home/builder
                    runuser --user builder -- makepkg --printsrcinfo
                  ' < /tmp/PKGBUILD > /tmp/.SRCINFO
            - name: Push AUR package
              env:
                  AUR_KEY: ${{ secrets.AUR_KEY }}
              run: |
                  mkdir -p ~/.ssh
                  echo "$AUR_KEY" > ~/.ssh/aur_key
                  chmod 600 ~/.ssh/aur_key
                  ssh-keyscan -t ed25519,rsa aur.archlinux.org >> ~/.ssh/known_hosts
                  export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key"
                  git clone ssh://aur@aur.archlinux.org/pi-ui-server-bin.git /tmp/aur-repo
                  cp /tmp/PKGBUILD /tmp/aur-repo/PKGBUILD
                  cp /tmp/.SRCINFO /tmp/aur-repo/.SRCINFO
                  cp LICENSE /tmp/aur-repo/LICENSE
                  cd /tmp/aur-repo
                  git config user.name "hyperpuncher"
                  git config user.email "hyperpuncher@users.noreply.github.com"
                  git add PKGBUILD .SRCINFO LICENSE
                  git diff --staged --quiet || git commit -m "upgpkg: pi-ui-server-bin ${GITHUB_REF_NAME#v}"
                  git push
