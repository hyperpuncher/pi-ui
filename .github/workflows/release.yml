name: release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

jobs:
    build:
        name: build ${{ matrix.name }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: linux-x64
                      os: ubuntu-26.04
                    - name: linux-arm64
                      os: ubuntu-26.04-arm
                    - name: darwin-x64
                      os: macos-26-intel
                    - name: darwin-arm64
                      os: macos-26
                    - name: windows-x64
                      os: windows-latest

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
            - name: install dependencies
              run: bun ci
            - name: build executable
              run: bun run build
            - name: package artifact
              shell: bash
              env:
                  NAME: ${{ matrix.name }}
              run: |
                  case "$NAME" in
                    linux-*)
                      tar -I 'zstd -10 -T0' -cf "dist/pi-ui-$NAME.tar.zst" -C dist pi-ui
                      ;;
                    darwin-*)
                      (cd dist && ditto -c -k --keepParent pi-ui "pi-ui-$NAME.zip")
                      ;;
                    windows-*)
                      (cd dist && 7z a "pi-ui-$NAME.zip" pi-ui.exe)
                      ;;
                  esac
            - uses: actions/upload-artifact@v7
              with:
                  path: dist/pi-ui-${{ matrix.name }}.*
                  archive: false

    release:
        name: release
        if: github.event_name == 'push'
        needs: [build]
        runs-on: ubuntu-slim
        permissions:
            contents: write
        env:
            GH_TOKEN: ${{ github.token }}

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true
                  skip-decompress: true
            - uses: hyperpuncher/release-notes@v1
              id: notes
            - run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "${{ steps.notes.outputs.path }}"

    aur:
        needs: [release]
        permissions:
            contents: read
        uses: ./.github/workflows/aur.yml
        with:
            tag: ${{ github.ref_name }}
        secrets:
            AUR_KEY: ${{ secrets.AUR_KEY }}

    npm:
        needs: [release]
        permissions:
            contents: read
            id-token: write
        uses: ./.github/workflows/npm.yml
        with:
            tag: ${{ github.ref_name }}

    homebrew:
        needs: [release]
        permissions:
            contents: read
        uses: ./.github/workflows/homebrew.yml
        with:
            tag: ${{ github.ref_name }}
        secrets:
            GH_PAT: ${{ secrets.GH_PAT }}
