name: Verify

on:
    push:
    pull_request:

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.0
            - name: Install dependencies
              run: bun ci
            - name: Build assets
              run: bun run assets:build
            - name: Lint
              run: bun run lint
            - name: Check
              run: bun run check
            - name: Test
              run: bun test
            - name: Build executable
              run: bun scripts/build.ts
